<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Bokningar</title>
  </head>
  <body>
    <div class="content_wrapper" id="content">
      <div class="h1">Bokningar</div>
      <div class="h2_container" id="timebook_con">
        <div class="h2_box"><div class="h2">Aktuella bokningar</div></div>
        <div id="timebook_con_content" class="h2_inner">
          <div class="accordion" id="accordion">
            <div id="accordion-group1" class="accordion-group">
              <div class="accordion-heading">
                <a class="accordion-toggle" href="#collapse1">
                  <div class="accordion-heading-left">
                    <div>Utvecklingssamtal höstterminen</div>
                    <div class="preview-block"></div>
                  </div>
                  <div class="accordion-heading-right">
                    <div class="accordion-heading-date-wide">2026-10-01 15:00 - 15:30</div>
                  </div></a
                >
              </div>
              <div id="collapse1" class="accordion-body collapse">
                <div class="accordion-inner">
                  <div class="accordion_inner_left">
                    <p class="acc-item-main">
                      <span id="description1"
                        >Välkommen på utvecklingssamtal. Boka en tid som passar.</span
                      >
                    </p>
                  </div>
                  <div class="accordion_inner_right">
                    <div class="inner_right_info">
                      <label>Status</label>
                      <div>Bokad</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div id="accordion-group2" class="accordion-group">
              <div class="accordion-heading">
                <a class="accordion-toggle" href="#collapse2">
                  <div class="accordion-heading-left"><div>Föräldramöte</div></div>
                  <div class="accordion-heading-right">
                    <div class="accordion-heading-date-wide">2026-11-12 18:00</div>
                  </div></a
                >
              </div>
              <div id="collapse2" class="accordion-body collapse">
                <div class="accordion-inner">
                  <div class="accordion_inner_right">
                    <div class="inner_right_info">
                      <label>Status</label>
                      <div>Ledig</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
