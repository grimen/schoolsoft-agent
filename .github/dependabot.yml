# Keeps the major-tag-pinned actions (@v4 etc.) current without SHA-pinning
# maintenance burden - PRs arrive when actions release new majors.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # -> "ci(deps): bump ..." (Conventional Commits)
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore # -> "chore(deps): bump ..." / "chore(deps-dev): ..."
      include: scope
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
