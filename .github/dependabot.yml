# Keeps the major-tag-pinned actions (@v4 etc.) current without SHA-pinning
# maintenance burden - PRs arrive when actions release new majors.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # -> "ci(deps): bump ..." (Conventional Commits)
      include: scope
    groups:
      actions:
        patterns: ["*"]
  # One npm entry: the root manifest is the workspace root, so it also covers
  # packages/app's manifest and the shared lockfile. A dependency joins the first
  # group that matches it, so the Expo set (which moves together, majors included,
  # per Expo SDK) comes first and the catch-all minor/patch group excludes it (the
  # two pattern lists must stay equal).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore # -> "chore(deps): bump ..." / "chore(deps-dev): ..."
      include: scope
    groups:
      app-expo:
        patterns:
          [
            "expo",
            "expo-*",
            "@expo/*",
            "react",
            "react-*",
            "react-native",
            "react-native-*",
            "jest-expo",
            "@testing-library/*",
            "test-renderer",
          ]
      npm-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          [
            "expo",
            "expo-*",
            "@expo/*",
            "react",
            "react-*",
            "react-native",
            "react-native-*",
            "jest-expo",
            "@testing-library/*",
            "test-renderer",
          ]
    open-pull-requests-limit: 5
