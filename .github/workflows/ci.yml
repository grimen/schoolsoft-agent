name: CI

# The one pipeline every branch runs, so a workflow badge filtered by branch
# is correct for that branch. Staged so a failure never spends the next
# stage's minutes:
#
#   Checks (lint, typecheck, format, boundaries, audit, package shape,
#           plugins, commits, docs, diagrams)                    ~1-2 min
#     -> Unit (tests + coverage thresholds)                      ~1 min
#       -> E2E (shipped artifact: MCP over stdio, CLI, mcpb,
#               every host manifest / skill in a sandbox)        ~2 min
#         -> Publish -> Verify (main / release / dispatch)
#
# The live SchoolSoft suite (`make e2e`) needs a human with BankID and never
# runs here. A docs-only PR stops after Checks (classified by the Changes
# job in checks.yml); main skips docs-only pushes via paths-ignore.
#
# Publishing (PUBLISH_GITHUB / PUBLISH_NPM below):
#   - GitHub Packages, as @grimen/schoolsoft-agent, with the workflow's own
#     GITHUB_TOKEN; always on, nothing to set up. Consumers need a token with
#     read:packages even for public packages (docs/development/releasing.md).
#   - npmjs.com, as schoolsoft-agent with provenance, whenever the NPM_TOKEN
#     secret exists (PUBLISH_NPM=auto); the step is skipped, not failed,
#     until then. GITHUB_TOKEN cannot publish to npmjs.com.
#   Verify installs from every registry that was actually published to.
#   - Stable (`latest`): only when a GitHub Release is published or
#     release-please.yml dispatches this workflow at a tag (`release_tag`).
#     The tag IS the version (vX.Y.Z -> X.Y.Z). A prerelease tag
#     (v1.0.0-rc.1) ships under `next`. Ships only once the commit's own
#     push-to-main run is green; release-retry.yml re-runs a blocked Publish.
#   - Prerelease (`next`): every push to main ships
#     <next-patch-after-latest-tag>-pre.<run>.<sha>.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"] # docs-only pushes ship nothing new
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Treat this run as the release of vX.Y.Z (set by release-please.yml)"
        type: string
        required: false

permissions:
  contents: read

env:
  PUBLISH_GITHUB: "true" # GitHub Packages, @grimen scope, GITHUB_TOKEN
  PUBLISH_NPM: "auto" # "auto": when NPM_TOKEN exists; "true" / "false" to force
  GITHUB_PACKAGE_NAME: "@grimen/schoolsoft-agent"

# PR refs: a newer push supersedes an in-flight run. main: never cancel a
# running publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
  unit:
    name: Unit
    needs: [checks]
    if: needs.checks.outputs.docs-only != 'true'
    uses: ./.github/workflows/test.yml
  e2e:
    name: E2E
    needs: [unit]
    uses: ./.github/workflows/e2e.yml

  # Badges for this branch under gh-pages/badges/<branch>/: measured coverage
  # (artifact from Unit, or a red "failing" placeholder) plus Unit / E2E
  # pass-fail badges. Always runs so a red badge replaces a stale green one;
  # skipped for fork PRs (no write token) and release runs (not a branch).
  badges:
    name: Badges
    needs: [checks, unit, e2e]
    if: |
      always() &&
      needs.checks.result != 'cancelled' && needs.unit.result != 'cancelled' && needs.e2e.result != 'cancelled' &&
      github.event_name != 'release' && inputs.release_tag == '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download coverage badge
        if: needs.unit.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: coverage/badge

      - name: Render "failing" coverage placeholder
        if: needs.unit.result == 'failure'
        run: npm run coverage:badge -- --status failing

      - name: Render Unit + E2E status badges
        env:
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          node scripts/status-badge.mjs unit Unit "$UNIT"
          node scripts/status-badge.mjs e2e E2E "$E2E"

      - name: Publish to gh-pages
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/ci/publish-badges.sh

  publish:
    name: Publish
    needs: [unit, e2e]
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance (npm registry only)
      packages: write # GitHub Packages
      actions: read # look up the commit's main run
    outputs:
      version: ${{ steps.ver.outputs.version }}
      disttag: ${{ steps.ver.outputs.disttag }}
      registries: ${{ steps.targets.outputs.registries }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags: the prerelease base is derived from the latest v* tag

      - name: Require a green main run for the release commit
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/require-green-main.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve version and dist-tag
        id: ver
        env:
          EVENT: ${{ inputs.release_tag != '' && 'release' || github.event_name }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
        run: bash scripts/release/resolve-version.sh

      - name: Build + generated artifacts
        run: make build skills

      # Which registries this run publishes to: GitHub Packages per the flag,
      # npm per the flag or (auto) whenever the secret exists.
      - name: Decide the target registries
        id: targets
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          github=false; npm=false
          [ "$PUBLISH_GITHUB" = "true" ] && github=true
          case "$PUBLISH_NPM" in
            true) npm=true ;;
            auto) [ "$HAS_NPM_TOKEN" = "true" ] && npm=true ;;
          esac
          list="[]"
          $github && $npm && list='["github","npm"]'
          $github && ! $npm && list='["github"]'
          ! $github && $npm && list='["npm"]'
          {
            echo "github=$github"
            echo "npm=$npm"
            echo "registries=$list"
          } >> "$GITHUB_OUTPUT"
          echo "publishing to: $list"

      # GitHub Packages only accepts packages scoped to the repository owner;
      # the scoped name lives only in this step so npm ships unscoped.
      - name: Publish to GitHub Packages
        if: steps.targets.outputs.github == 'true'
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GH_TOKEN" > "$RUNNER_TEMP/npmrc-github"
          npm pkg set name="$GITHUB_PACKAGE_NAME"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-github" \
            npm publish --access public --tag "$DIST_TAG" --registry https://npm.pkg.github.com
          git checkout -- package.json
        env:
          DIST_TAG: ${{ steps.ver.outputs.disttag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.targets.outputs.npm == 'true'
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc-npm"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-npm" \
            npm publish --provenance --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org
        env:
          DIST_TAG: ${{ steps.ver.outputs.disttag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build the Claude Desktop bundle
        run: make mcpb

      - name: Attach the bundle to the GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/schoolsoft-agent.mcpb --clobber

  # Consumes what was ACTUALLY published: installs the exact version from
  # the registry into a clean prefix and asserts the consumer contract.
  registry-smoke:
    name: Verify
    needs: [publish]
    if: needs.publish.outputs.registries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJSON(needs.publish.outputs.registries) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the published version and assert the consumer contract
        env:
          PUBLISH_REGISTRY: ${{ matrix.registry }}
          NODE_AUTH_TOKEN: ${{ matrix.registry == 'github' && secrets.GITHUB_TOKEN || '' }}
        run: bash scripts/release/registry-smoke.sh "${{ needs.publish.outputs.version }}"
