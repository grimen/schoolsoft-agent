name: Checks / Commits (title edit)

# The gating commit + title lint is the Commits job in checks.yml, run by
# ci.yml on every PR push. This only covers a PR title edit: ci.yml does not
# run on `edited` (a title change must not re-run the whole pipeline).
on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
