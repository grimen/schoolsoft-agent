name: Tests / Unit

# Reusable only: ci.yml calls this after Checks. Coverage thresholds are
# enforced by .c8rc.json; the badge + HTML report feed the Badges job.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit + boundary + functional + packaging tests with coverage
        run: make coverage
      - name: Render coverage badge + HTML report
        run: make coverage-badge
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage/badge/coverage.svg
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30
          if-no-files-found: error
