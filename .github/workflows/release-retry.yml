name: Release / Retry

# Makes a release fire-and-forget. ci.yml's Publish job refuses to ship a
# release while the commit's push-to-main run is red. When CI on main
# completes green, re-run the failed jobs of any release run for that commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Re-run blocked releases
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Re-run failed release runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/release/rerun-blocked.sh
