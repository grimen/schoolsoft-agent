# Fresh deployment using a named Cloudflare Tunnel instead of Caddy.
# Run with this file alone; do not combine it with compose.connector.yaml.
services:
  connector:
    extends:
      file: compose.connector.yaml
      service: connector
    environment:
      # Cloudflare's edge appends the visitor address last; cloudflared passes it on.
      # Unconfirmed live: verify with the owner page's Address check.
      SCHOOLSOFT_PROXY_HOPS: "1"
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      connector:
        condition: service_healthy
volumes:
  schoolsoft-state:
